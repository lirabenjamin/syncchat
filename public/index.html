<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root {
    --ink: #1f2328; --muted: #656d76; --line: #e4e7eb; --bg: #ffffff; --soft: #f5f6f8;
    --accent: #3b5bdb; --accent-ink: #ffffff; --warn: #c92a2a; --banner: #edf2ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  #app { max-width: 680px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; padding: 12px 16px; }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.on { display: flex; }
  .center { justify-content: center; align-items: center; text-align: center; gap: 6px; }
  .center h2 { margin: 12px 0 4px; font-size: 19px; font-weight: 600; }
  .center p { margin: 0; color: var(--muted); max-width: 420px; }
  .pulse { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
  .elapsed { font-variant-numeric: tabular-nums; font-size: 13px; margin-top: 8px !important; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px 10px; border-bottom: 1px solid var(--line); }
  .topbar .who { font-weight: 600; }
  .clock { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 17px; padding: 2px 10px; border-radius: 999px; background: var(--soft); }
  .clock.low { color: var(--warn); }
  .banner { margin: 10px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--banner); font-size: 14px; white-space: pre-line; }
  .right { display: flex; align-items: center; gap: 8px; }
  #done { padding: 6px 14px; font-size: 14px; }
  .msg.divider { align-self: stretch; max-width: none; text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; border-top: 1px solid var(--line); border-radius: 0; padding: 10px 0 2px; margin-top: 6px; }
  .banner:empty { display: none; }
  .pane { flex: 1; min-height: 200px; overflow-y: auto; padding: 14px 2px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 78%; padding: 8px 13px; border-radius: 16px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; }
  .msg.them { align-self: flex-start; background: var(--soft); border-bottom-left-radius: 5px; }
  .msg.sys { align-self: center; max-width: 92%; background: none; color: var(--muted); font-size: 13px; text-align: center; }
  .composer { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
  .composer input { flex: 1; padding: 11px 13px; font: inherit; border: 1px solid #cfd4da; border-radius: 10px; outline: none; }
  .composer input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 91, 219, .15); }
  button { font: inherit; font-weight: 600; padding: 11px 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #continue { margin-top: 18px; }
</style>
</head>
<body>
<div id="app">
  <section id="view-wait" class="view center on">
    <div class="pulse"></div>
    <h2 id="wait-title">Finding a conversation partner</h2>
    <p>Please keep this page open. You will be connected as soon as another participant is ready.</p>
    <p class="elapsed" id="elapsed"></p>
  </section>

  <section id="view-chat" class="view">
    <div class="topbar">
      <span class="who">Chat with another participant</span>
      <span class="right">
        <button id="done" type="button" hidden>Done</button>
        <span class="clock" id="clock">0:00</span>
      </span>
    </div>
    <div class="banner" id="banner"></div>
    <div class="pane" id="pane" aria-live="polite"></div>
    <form class="composer" id="composer">
      <input id="input" type="text" placeholder="Type a message" autocomplete="off" aria-label="Message">
      <button id="send" type="submit">Send</button>
    </form>
  </section>

  <section id="view-between" class="view center">
    <h2 id="between-title">Stage complete</h2>
    <p id="between-sub"></p>
    <button id="next-stage" type="button" hidden>Continue</button>
  </section>

  <section id="view-end" class="view center">
    <h2 id="end-title">Chat complete</h2>
    <p id="end-sub"></p>
    <button id="continue" type="button">Continue</button>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(async function () {
  const params = Object.fromEntries(new URLSearchParams(location.search));
  // `study` picks one study when the server hosts several (the gallery).
  const cfg = await (await fetch('/client-config.json' + (params.study ? '?study=' + encodeURIComponent(params.study) : ''))).json();
  const pid = params[cfg.id_param] || '';
  const $ = (id) => document.getElementById(id);

  // Post only to a parent whose origin is on the study's allow-list.
  const embedded = window.parent !== window;
  const parentOrigin = (() => {
    if (!embedded) return null;
    let o = location.ancestorOrigins && location.ancestorOrigins[0];
    if (!o && document.referrer) { try { o = new URL(document.referrer).origin; } catch (e) { /* none */ } }
    return cfg.parent_origin_patterns.some((p) => new RegExp(p, 'i').test(o || '')) ? o : null;
  })();
  if (embedded && !parentOrigin) console.warn('syncchat: parent page origin is not in embed.allowed_origins; no messages will be sent to it');

  let result = {};
  function notify(type, data = result) {
    if (parentOrigin) window.parent.postMessage({ source: 'syncchat', type, participant_id: pid, ...data }, parentOrigin);
  }

  function show(name) {
    for (const v of ['wait', 'chat', 'between', 'end']) $('view-' + v).classList.toggle('on', v === name);
  }
  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function add(cls, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    $('pane').appendChild(el);
    $('pane').scrollTop = $('pane').scrollHeight;
  }
  function finish(title, sub) {
    clearInterval(ticker);
    $('end-title').textContent = title;
    $('end-sub').textContent = sub;
    show('end');
  }

  let ticker = null;
  function waitFor(title) {
    clearInterval(ticker);
    $('wait-title').textContent = title;
    const start = Date.now();
    ticker = setInterval(() => { $('elapsed').textContent = 'Waiting ' + fmt(Date.now() - start); }, 500);
    show('wait');
  }
  waitFor('Finding a conversation partner');

  // The current stage (see stageInfo in src/app.js) and how many messages I have sent in it.
  let stage = null;
  let myCount = 0;
  let staged = false;
  let ended = false;
  const divider = (index) => add('divider', 'Stage ' + (index + 1) + ' of ' + stage.count);

  function applyStage(s) {
    stage = s;
    staged = s.id !== null;
    myCount = s.my_count;
    $('banner').textContent = [s.reveal, s.prompt].filter(Boolean).join('\n');
    clearInterval(ticker);
    const clock = $('clock');
    ticker = setInterval(() => {
      if (stage.ends_at) {
        const left = stage.ends_at - Date.now();
        clock.textContent = fmt(left);
        clock.classList.toggle('low', left <= 30000);
      } else clock.textContent = fmt(Date.now() - stage.started_at) + ' elapsed';
    }, 250);
    renderDone();
    show('chat');
    $('input').focus();
  }

  // Done is shown when the stage can end early; it unlocks once I have sent min_messages.
  function renderDone() {
    const btn = $('done');
    btn.hidden = !stage || stage.end_when === 'timer';
    if (btn.hidden) return;
    if (stage.done) {
      btn.disabled = true;
      btn.textContent = 'Waiting for your partner to finish';
    } else if (myCount < stage.min_messages) {
      btn.disabled = true;
      btn.textContent = myCount + ' of ' + stage.min_messages + ' messages sent';
    } else {
      btn.disabled = false;
      btn.textContent = 'Done';
    }
  }

  $('input').maxLength = cfg.max_message_length;
  const socket = io();
  // A staged chat survives a dropped connection, so rejoin on every reconnect until it ends.
  socket.on('connect', () => { if (!result.match_id || (staged && !ended)) socket.emit('join', params); });

  socket.on('joinError', ({ message }) => {
    ended = true;
    result = { outcome: 'error', error: message };
    finish('We could not start the chat', message);
    notify('chat_ended');
  });

  socket.on('matched', (m) => {
    result = { match_id: m.match_id, waited_ms: m.waited_ms, reveal: m.reveal, match_reason: m.match_reason, partner_id: m.partner_id };
    if (m.intro) add('sys', m.intro);
    add('sys', 'You are now connected. Please be respectful.');
    if (m.stage.count > 1) divider(0);
    applyStage(m.stage);
    notify('chat_matched');
  });

  // Reconnect, or the next stage after a rejoin: rebuild the whole chat.
  socket.on('chatState', (st) => {
    Object.assign(result, { match_id: st.match_id, partner_id: st.partner_id });
    $('pane').textContent = '';
    stage = st.stage;
    if (st.intro) add('sys', st.intro);
    let shown = -1;
    const upTo = (i) => { while (shown < i) { shown++; if (stage.count > 1) divider(shown); } };
    for (const x of st.transcript) {
      upTo(x.stage_index);
      add(x.mine ? 'me' : 'them', x.text);
    }
    upTo(st.stage.index);
    if (st.partner_away) add('sys', 'Your partner lost connection. Waiting for them to come back.');
    applyStage(st.stage);
  });

  socket.on('stageStarted', (s) => {
    stage = s;
    divider(s.index);
    applyStage(s);
  });

  socket.on('stageExtended', (e) => {
    stage.ends_at = e.ends_at;
    add('sys', 'Time is extended until each of you has sent at least ' + e.min_messages + ' messages.');
  });

  socket.on('message', (msg) => {
    add(msg.mine ? 'me' : 'them', msg.text);
    if (msg.mine) {
      myCount++;
      renderDone();
    }
  });
  socket.on('rateLimited', () => add('sys', 'You are sending messages too quickly. Please slow down.'));

  socket.on('doneUpdate', (d) => {
    if (d.partner_done && !stage.partner_done) add('sys', 'Your partner is ready to finish.');
    Object.assign(stage, d);
    renderDone();
  });
  socket.on('doneRejected', (d) => {
    stage.done = false;
    myCount = d.sent;
    renderDone();
  });
  $('done').addEventListener('click', () => {
    stage.done = true;
    renderDone();
    socket.emit('done');
  });

  socket.on('partnerAway', (e) => add('sys', 'Your partner lost connection. Waiting up to ' + fmt(e.grace_ms) + ' for them to come back.'));
  socket.on('partnerBack', () => add('sys', 'Your partner is back.'));

  // A `then: qualtrics` stage ended: Qualtrics moves on, and a later chat question rejoins this partner.
  socket.on('stageEnded', (e) => {
    clearInterval(ticker);
    $('between-title').textContent = 'Stage ' + (e.stage_index + 1) + ' complete';
    const btn = $('next-stage');
    btn.hidden = embedded;
    if (embedded) $('between-sub').textContent = 'Please continue with the survey. You will rejoin the same partner later.';
    else {
      $('between-sub').textContent = 'In your study, your Qualtrics survey would show here.';
      btn.textContent = 'Continue to stage ' + (e.stage_index + 2);
      btn.onclick = () => { location.href = '/?' + new URLSearchParams({ ...params, stage: e.next_stage }); };
    }
    show('between');
    notify('stage_ended', { ...e, advance: true });
  });

  socket.on('waitingPartner', () => waitFor('Waiting for your partner to return'));

  socket.on('chatEnded', (e) => {
    ended = true;
    Object.assign(result, { outcome: e.outcome, match_id: e.match_id, message_count: e.message_count, met_min_messages: e.met_min_messages, end_reason: e.end_reason });
    if (e.stage) result.stage = e.stage;
    if (e.transcript) result.transcript = e.transcript;
    const titles = { partner_left: 'Chat ended', no_rejoin: 'Chat ended' };
    const subs = {
      partner_left: 'Your partner left the conversation. Your responses have been recorded.',
      no_rejoin: 'This conversation has ended.',
    };
    finish(titles[e.outcome] || 'Chat complete', subs[e.outcome] || 'Thank you for chatting.');
    notify('chat_ended');
  });

  socket.on('noMatch', (e) => {
    result = { outcome: 'nomatch', waited_ms: e.waited_ms };
    finish('No partner was available', 'No one else is available to chat right now. You can continue with the study.');
    notify('nomatch');
  });

  $('composer').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const text = $('input').value.trim();
    if (!text) return;
    socket.emit('message', text);
    $('input').value = '';
  });

  $('continue').addEventListener('click', () => {
    if (embedded) return notify('chat_continue');
    if (cfg.redirect_url) {
      location.href = cfg.redirect_url
        .replace('{id}', encodeURIComponent(pid))
        .replace('{outcome}', encodeURIComponent(result.outcome || ''));
    } else if (params.study) {
      location.href = '/demo?study=' + encodeURIComponent(params.study); // gallery demo: back to its form
    } else {
      $('continue').disabled = true;
      $('end-sub').textContent = 'You can close this window.';
    }
  });
})();
</script>
</body>
</html>
