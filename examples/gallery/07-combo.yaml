# Combining rules: cross-party pairs who either share an interest OR are within 5 years
# of age, never two people of the same gender. Ties go to more shared interests, then age.
title: Combined rules
description: A Democrat meets a Republican who shares an interest or is within 5 years of age, and the two never have the same gender.

study:
  id: combo

participant:
  fields:
    party:  {type: category, label: Your party, values: [Democrat, Republican]}
    gender: {type: category, label: Your gender, values: [Woman, Man, Nonbinary]}
    age:    {type: number, label: Your age, min: 18, max: 99}
    interests:
      type: list
      label: Pick two interests
      options: [coffee, hiking, cooking, jazz, soccer, travel]
      pick: 2

conditions:
  combo:
    require:
      - differ: party
      - any_of:                          # at least one of these must hold
          - overlap: {field: interests, min: 1}
          - within: {field: age, max: 5}
      - not: {same: gender}              # never the same gender
    prefer:
      - overlap: {field: interests}      # more shared interests first
      - closest: age                     # then closer age
    reveal: "Your partner is a {partner.party}, a {partner.gender} aged {partner.age}."

timing:
  match_timeout: 120s
  chat_duration: 300s

embed:
  allowed_origins: ["https://*.qualtrics.com"]
