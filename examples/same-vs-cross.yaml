# Example 3: Qualtrics randomizes each participant into `same` or `cross`
# (embedded data field `cond`). People only ever match within their own
# condition, so a `same` participant never meets a `cross` participant.
study:
  id: same-vs-cross
  group_size: 2

participant:
  id_param: id
  condition_param: cond
  fields:
    party:  {type: category, values: [Democrat, Republican]}
    age:    {type: number}

conditions:
  same:
    require:
      - same: party
    prefer:
      - closest: age
    reveal: "Your partner is also a {partner.party}."
  cross:
    require:
      - differ: party
    prefer:
      - closest: age
    reveal: "Your partner is a {partner.party}."

timing:
  match_timeout: 60s
  chat_duration: 3m

on_timeout: nomatch

embed:
  allowed_origins: ["https://*.qualtrics.com"]
  redirect_url: null
